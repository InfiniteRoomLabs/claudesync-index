name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.10.3", python-version: "${{ matrix.python }}" }
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run pytest tests/ --cov=reindex --cov-fail-under=85
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.10.3" }
      - run: uv build
      - run: |
          mkdir -p /tmp/export/conversations
          uvx --from dist/*.whl csindex full --root /tmp/export --help
          uvx --from dist/*.tar.gz csindex --help
